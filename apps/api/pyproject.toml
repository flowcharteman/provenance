[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-analysis-api"
version = "0.1.0"
description = "Backend contracts and foundations for the investment analysis platform"
requires-python = ">=3.9"
dependencies = [
    "certifi>=2024.2.2",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
sec-ingest = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
